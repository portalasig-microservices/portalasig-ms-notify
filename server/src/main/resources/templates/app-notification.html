<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Portal de la Facultad de Ciencias - UCV</title>

    <style th:utext="${external_css}"></style>
</head>

<body>

<div class="panel panel-primary">
    <div class="panel-heading">
        <div class="panel-heading-content">
            <img th:if="${logo_url}" th:src="${logo_url}" alt="Logo UCV" class="panel-logo"/>
            <h3 class="panel-title" th:text="${title}">Portal de sitios web de asignaturas de la Facultad de Ciencias - UCV</h3>
        </div>
    </div>

    <div class="panel-body">
        <p th:if="${target}" th:text="${target}"></p>
        <p th:if="${primary_body}" th:utext="${primary_body}"></p>
        <p th:if="${secondary_body}" th:text="${secondary_body}"></p>

        <a
            th:if="${url != null and url_label != null}"
            th:href="${url}"
            th:text="${url_label}"
            class="btn btn-primary"
        >Ver detalle</a>

        <p class="closing" th:if="${closing_message}" th:text="${closing_message}">Universidad Central de Venezuela — Facultad de Ciencias</p>
    </div>

    <div class="panel-footer text-center">
        <p>Universidad Central de Venezuela</p>
        <p>Facultad de Ciencias</p>
        <p>Paseo Los Ilustres Urb. Valle Abajo. Código Postal 1040. Caracas-Venezuela</p>
    </div>
</div>
</body>
</html>
